[project]
name = "pitwall-rig"
version = "0.1.0"
description = "Pitwall rig service: reads sim telemetry, records laps, serves the live dashboard."
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
]

[project.optional-dependencies]
# Background wheel input (SDL2 via pygame) and global keyboard hotkeys. Windows rig only.
input = [
    "pygame-ce>=2.4",
    "pynput>=1.7",
]

[project.scripts]
pitwall-rig = "pitwall_rig.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.8,<0.12.0"]
build-backend = "uv_build"
