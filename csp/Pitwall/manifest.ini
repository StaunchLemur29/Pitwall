[ABOUT]
NAME = Pitwall
AUTHOR = Pitwall
VERSION = 0.4
DESCRIPTION = Pitwall's in-game companion: next corner, brake countdown and instant drill retry. Needs the Pitwall service running.
REQUIRED_VERSION = 2498

[CORE]
LAZY = NONE  ; keep running from load to quit, so drill retries work even with the window hidden

[WINDOW_...]
ID = main
NAME = Pitwall
ICON = icon.png
FUNCTION_MAIN = windowMain
FUNCTION_SETTINGS = windowSettings
; transparent: the title bar only shows when you hover it; the cog opens the toggles
FLAGS = SETTINGS, FADING, FLOATING_TITLE_BAR, NO_BACKGROUND, NO_SCROLLBAR, NO_SCROLL_WITH_MOUSE
MIN_SIZE = 220, 80
SIZE = 360, 90
